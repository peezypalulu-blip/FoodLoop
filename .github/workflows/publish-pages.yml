name: Publish PlateRipple public teaser to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/publish-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy public teaser (never private app source)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate public teaser
        run: |
          test -s docs/index.html
          test -s docs/about.html
          test -s docs/sitemap.xml
          test -s docs/privacy.html
          test -s docs/delete-account.html
          ! grep -r -Ei 'OPENAI_API_KEY|SUPABASE_SERVICE_ROLE|PAYSTACK_SECRET_KEY|sk_(live|test)_' docs/ || { echo "Potential secret in public docs"; exit 1; }
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
